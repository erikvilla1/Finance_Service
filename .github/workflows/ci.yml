name: CI

# Every push, and every pull request into main. Pushes are covered as well as
# PRs so a branch is known to be green before anyone opens one — finding out at
# review time that a branch never compiled wastes the reviewer, not the author.
on:
  push:
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first. Nobody needs the result
# for a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    env:
      # The publishable key, which is already committed in .env.example and is
      # safe in a browser by design — Row Level Security is the real boundary
      # (spec §21). It is here because `next build` prerenders pages that read
      # from Supabase, and those fail at build time without it.
      #
      # SUPABASE_SERVICE_ROLE_KEY is deliberately absent. It bypasses RLS
      # entirely, nothing needs it to compile, and a build server is not a place
      # to keep one.
      NEXT_PUBLIC_SUPABASE_URL: https://crgvrzcifidcpfhazhxu.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_oLemQmh7on_v8jxtluzudw_S4W90JB4
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` rather than `install`: it installs exactly what package-lock.json
      # pins and fails if the two have drifted, which is the point of running
      # this on a machine that is not yours.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Last because it is the slowest, and because it is the step that catches
      # what the other two cannot: server-only code reaching a client component,
      # which typechecks perfectly and breaks at runtime.
      - name: Build
        run: npm run build
